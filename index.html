<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة نقاط معركة الشعبية الفردية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #4CAF50;
        }
        .result-box {
            background-color: #1b3320;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .result-item {
            margin-bottom: 15px;
            font-size: 16px;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .loss-box {
            background-color: #331b1b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>حاسبة نقاط معركة الشعبية الفردية</h2>

        <div class="input-group">
            <label>شعبيتي:</label>
            <input type="text" inputmode="numeric" id="myPop" placeholder="أدخل شعبيتك هنا" oninput="calculatePK()">
        </div>

        <div class="input-group">
            <label>شعبية الخصم:</label>
            <input type="text" inputmode="numeric" id="oppPop" placeholder="أدخل شعبية الخصم هنا" oninput="calculatePK()">
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-item" id="resultText">النتيجة: --</div>
            <div class="result-item" id="myPoints">نقاطي: 0</div>
            <div class="result-item" id="oppPoints">نقاط خصمي: 0</div>
        </div>
    </div>

    <script>
        // دالة مخصصة لتحويل الأرقام العربية إلى إنجليزية ليفهمها المتصفح
        function parseArabic(str) {
            if (!str) return 0;
            let engStr = str.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
                            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
            return parseInt(engStr) || 0;
        }

        function calculatePK() {
            let myPop = parseArabic(document.getElementById('myPop').value);
            let oppPop = parseArabic(document.getElementById('oppPop').value);

            let myPts = 0;
            let oppPts = 0;
            let resultString = "--";
            
            let resultBox = document.getElementById('resultBox');

            if (myPop === 0 && oppPop === 0) {
                document.getElementById('resultText').innerText = "النتيجة: --";
                document.getElementById('myPoints').innerText = "نقاطي: 0";
                document.getElementById('oppPoints').innerText = "نقاط خصمي: 0";
                resultBox.className = "result-box";
                return;
            }

            if (myPop > oppPop) {
                resultString = "فوز 🏆";
                myPts = Math.floor(myPop / 10000);
                oppPts = Math.floor((oppPop / 10000) * 0.7);
                resultBox.className = "result-box"; 
            } else if (myPop < oppPop) {
                resultString = "خسارة 💔";
                myPts = Math.floor((myPop / 10000) * 0.7);
                oppPts = Math.floor(oppPop / 10000);
                resultBox.className = "result-box loss-box"; 
            } else {
                resultString = "تعادل 🤝";
                myPts = Math.floor(myPop / 10000);
                oppPts = Math.floor(oppPop / 10000);
                resultBox.className = "result-box"; 
            }

            document.getElementById('resultText').innerText = "النتيجة: " + resultString;
            document.getElementById('myPoints').innerText = "نقاطي: " + myPts;
            document.getElementById('oppPoints').innerText = "نقاط خصمي: " + oppPts;
        }
    </script>

</body>
</html>
