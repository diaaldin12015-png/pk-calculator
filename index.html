<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة نقاط معركة الشعبية الفردية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #4CAF50;
        }
        .result-box {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            transition: 0.3s;
        }
        .result-item {
            margin-bottom: 15px;
            font-size: 16px;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .win-box {
            background-color: #1b3320; 
        }
        .loss-box {
            background-color: #331b1b; 
        }
        .tie-box {
            background-color: #332d1b; 
        }
        .credits {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.8;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
        .credits a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>حاسبة نقاط معركة الشعبية الفردية</h2>

        <div class="input-group">
            <label>شعبيتي:</label>
            <input type="text" inputmode="numeric" id="myPop" placeholder="أدخل شعبيتك هنا" oninput="calculatePK()">
        </div>

        <div class="input-group">
            <label>شعبية الخصم:</label>
            <input type="text" inputmode="numeric" id="oppPop" placeholder="أدخل شعبية الخصم هنا" oninput="calculatePK()">
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-item" id="resultText">النتيجة: --</div>
            <div class="result-item" id="myPoints">نقاطي: 0</div>
            <div class="result-item" id="oppPoints">نقاط خصمي: 0</div>
        </div>

        <div class="credits">
            ✦ برمجة وتصميم : <a href="https://t.me/xxFMx" target="_blank">@xxFMx</a><br>
            ✧ قناة التيليجرام : <a href="https://t.me/TYxxxx" target="_blank">@TYxxxx</a>
        </div>
    </div>

    <script>
        function parseArabic(str) {
            if (!str) return 0;
            let engStr = str.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
                            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
            return parseInt(engStr) || 0;
        }

        function getBasePoints(pop) {
            if (pop >= 2000000) return 42;
            if (pop >= 900000) return 40;
            if (pop >= 500000) return 36;
            if (pop >= 260000) return 32;
            if (pop >= 120000) return 28;
            if (pop >= 50000) return 24;
            if (pop >= 15000) return 20;
            if (pop >= 8000) return 16;
            if (pop >= 5000) return 14;
            if (pop >= 2500) return 10;
            return 6;
        }

        function calculatePK() {
            let rawMy = document.getElementById('myPop').value.trim();
            let rawOpp = document.getElementById('oppPop').value.trim();
            let resultBox = document.getElementById('resultBox');

            if (rawMy === '' || rawOpp === '') {
                document.getElementById('resultText').innerText = "النتيجة: --";
                document.getElementById('myPoints').innerText = "نقاطي: 0";
                document.getElementById('oppPoints').innerText = "نقاط خصمي: 0";
                resultBox.className = "result-box"; 
                return;
            }

            let myPop = parseArabic(rawMy);
            let oppPop = parseArabic(rawOpp);

            let myBase = getBasePoints(myPop);
            let oppBase = getBasePoints(oppPop);
            
            let myPts = 0;
            let oppPts = 0;
            let resultString = "--";

            if (myPop > oppPop) {
                resultString = "فوز";
                myPts = myBase + Math.floor(oppBase / 2);
                oppPts = Math.floor(oppBase / 2);
                resultBox.className = "result-box win-box"; 
            } else if (myPop < oppPop) {
                resultString = "خسارة";
                myPts = Math.floor(myBase / 2);
                oppPts = oppBase + Math.floor(myBase / 2);
                resultBox.className = "result-box loss-box"; 
            } else {
                resultString = "تعادل";
                myPts = Math.floor(myBase / 2);
                oppPts = Math.floor(oppBase / 2);
                resultBox.className = "result-box tie-box"; 
            }

            document.getElementById('resultText').innerText = "النتيجة: " + resultString;
            document.getElementById('myPoints').innerText = "نقاطي: " + myPts;
            document.getElementById('oppPoints').innerText = "نقاط خصمي: " + oppPts;
        }
    </script>

</body>
</html>
